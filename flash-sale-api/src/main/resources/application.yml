spring:
  application:
    name: flash-sale

  datasource:
    # allowPublicKeyRetrieval=true 是 MySQL 8 預設的 caching_sha2_password 在
    # 非 SSL 連線下必要的參數，否則首次認證會失敗於 "Public Key Retrieval is not allowed"。
    # 它會讓用戶端向伺服器索取 RSA 公鑰，在不受信任的網路上有中間人風險——
    # 正式環境應改為 useSSL=true 並移除此參數。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:flash_sale}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${MYSQL_USER:flashsale}
    password: ${MYSQL_PASSWORD:flashsale}
    hikari:
      # 「核心數 * 2 + 磁碟數」那條經驗法則的前提是**連線全部拿來跑查詢**。
      # 這裡不成立：光是 MQ 消費端就常駐 15 條執行緒
      # （建單 6、補償 3、通知 2、履約 2、退款 1、死信 1），
      # 加上排程執行緒後，留給 HTTP 的只剩個位數。
      #
      # 尖峰時訂單頁每秒數千次輪詢全部撞在那幾條上，
      # 拿不到連線的請求會卡滿 connection-timeout(3s) 才失敗——
      # 那不是資料庫慢，是我們自己把連線分光了。
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 3000
      # 比 MySQL 預設的 wait_timeout(28800s) 短，避免拿到已被伺服器關閉的死連線
      max-lifetime: 1200000

  task:
    scheduling:
      pool:
        # 預設是 1。這個應用有十個排程掛在上面（Outbox 中繼、逾時關單、
        # 通知寄送、待退款掃描、庫存預熱、庫存釋放、對帳、令牌清理⋯⋯），
        # 共用一條執行緒時，中繼器一輪跑得久一點，其他全部餓死。
        #
        # 最難看的後果是逾時關單被延後：訂單不關單就不退庫存，變成少賣。
        #
        # 排程之間因此會真正並行。跨節點互斥本來就靠 Redisson 鎖而不是
        # 靠單執行緒序列化，所以這個改動不會破壞既有的互斥假設。
        size: 4

  jpa:
    hibernate:
      # 結構一律由 Flyway 管理。讓 Hibernate 自動改結構，等於把 schema 變更交給執行期決定，
      # 在生產環境是災難的起點。
      ddl-auto: validate
    open-in-view: false   # 關閉！否則交易會延續到 View 渲染，長時間佔住連線
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8
          max-wait: 500ms

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    # 搜尋是可以降級的功能，連線逾時設短：ES 慢的時候，
    # 快速失敗退回資料庫，遠好過讓使用者盯著轉圈
    connection-timeout: 1s
    socket-timeout: 3s

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all + 冪等生產者：避免 broker 故障切換時遺失或重複訊息。
      # 秒殺的訊息遺失等於庫存永久消失，這裡不能為了吞吐妥協。
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 3
      # 生產者放棄前的總時間。**明訂而不是靠預設值**：
      # 熱路徑只等 flash-sale.mq.send-timeout(500ms)，逾時後不退庫
      # （逾時 = 不知道送到沒，退庫會超賣，見 ADR-0030），
      # 而「最終到底送出去了沒」由這個值決定。
      # 它同時是對帳孤兒寬限期的下界：寬限期必須明顯長於它，
      # 否則會把還在重試的請求誤判成孤兒而退庫——那就從少賣變成超賣。
      properties.delivery.timeout.ms: 120000
      # 攢批投遞：5ms 的延遲換取顯著的吞吐提升，對非同步建單完全無感
      batch-size: 32768
      properties.linger.ms: 5
      compression-type: lz4
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # 手動 ack 由 Spring 的 listener container 管理，關閉自動提交，
      # 否則訊息會在處理完成前就被標記為已消費，故障時直接遺失。
      enable-auto-commit: false
      max-poll-records: 100
    listener:
      ack-mode: record
      # 消費端並行度另在 @KafkaListener 上以設定值指定，方便依 topic 個別調整
      type: single
      # 消費端從 header 接續 trace（ADR-0029）
      observation-enabled: true
    template:
      # 生產端把 traceparent 放進 header
      observation-enabled: true

flash-sale:
  mq:
    send-timeout: 500ms
    order-create-concurrency: 6
    compensation-concurrency: 3
  order:
    payment-window: 15m
    compensation-batch-size: 200
    close-interval-ms: 30000
  stock:
    key-ttl-buffer: 2h
    warmup-interval-ms: 60000
  snowflake:
    # 多副本部署時必須各自不同，否則會產生重複訂單號。
    # K8s 可用 StatefulSet 的序號注入：node-id: ${HOSTNAME##*-}
    node-id: ${SNOWFLAKE_NODE_ID:0}
  search:
    reconciliation-interval-ms: 900000
    # 啟動後先讓索引 bootstrap 與 MQ 追上，否則第一輪必然報一堆假偏差
    reconciliation-initial-delay-ms: 180000
    # 與庫存對帳相反，這裡預設開啟自動修復。
    #
    # 差別不在重要性，在修復動作的性質：這裡的修復與那個還沒被消費的事件
    # 會做的事一模一樣（讀當下狀態、上架就寫、否則移除），提早做不會產生
    # 任何新狀態；庫存的「退庫」則是一個新的決定，可能與還在佇列裡的請求衝突。
    auto-repair-index: true

  outbox:
    batch-size: 200
    max-retry: 5
    retention-days: 7
    relay-interval-ms: 1000
    cleanup-cron: "0 30 3 * * *"
  reconciliation:
    # 每 10 分鐘核對一次「Redis 餘量 + 未取消訂單數量 = 活動總庫存」
    interval-ms: 600000
    # 啟動後先等 2 分鐘：此時預熱未完成、MQ 積壓未消化，太早對帳只會報出假偏差
    initial-delay-ms: 120000
    # 必須明顯長於三者：order.payment-window(15m)、MQ 重試總時長、
    # 以及生產者的 delivery.timeout.ms(2m)——投遞逾時的請求在那段時間內
    # 仍可能送達並建單（ADR-0030）。
    # 訂得太短會把還在路上的請求誤判為孤兒而退庫，那就從少賣變成超賣。
    orphan-grace-period: 30m
    scan-batch-size: 500
    # 預設關閉：有 bug 的自動修復，破壞力大於它要修的問題。
    # 觀察一段時間確認偵測邏輯無誤後再考慮開啟。
    auto-repair-orphans: ${RECONCILIATION_AUTO_REPAIR:false}

  payment:
    # 回調簽章金鑰。正式環境由金流商提供，絕不可用預設值——
    # 那等於公開了偽造「付款成功」的方法。
    callback-secret: ${PAYMENT_CALLBACK_SECRET:dev-only-payment-secret-change-me-0123456789abcdef}
    # 相對路徑：由前端解析成自己的 /pay/simulated 頁。先前指到後端一個不存在的路徑，
    # 使用者按下付款就被丟到一頁 401 的 JSON 上
    simulated-checkout-url: ${PAYMENT_SIMULATED_CHECKOUT_URL:/pay/simulated}
    # 模擬閘道多久後送回調。真實金流是使用者操作完才回調，
    # 這裡用短延遲模擬「非同步」這個本質特性
    simulate-callback-delay: 2s
    # 設為 false 可測試付款失敗的路徑
    auto-succeed: ${PAYMENT_AUTO_SUCCEED:true}
    # 待退款掃描間隔（毫秒）。每一筆待退款都代表有錢卡在系統裡
    refund-scan-interval-ms: 60000

  security:
    # 初始管理員：系統中還沒有任何 ADMIN 時才會生效一次。
    #
    # **刻意沒有預設值。** 給了預設信箱與密碼，等於每次部署都自帶一組
    # 已知憑證的管理員帳號——那是會出現在漏洞報告裡的那種預設值，
    # 而且因為系統「就這樣跑起來了」，沒有人會發現它存在。
    #
    # 啟用方式（密碼務必用環境變數，不要寫進版控）：
    #   BOOTSTRAP_ADMIN_EMAIL=ops@example.com BOOTSTRAP_ADMIN_PASSWORD=... mvn spring-boot:run -pl flash-sale-api
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${BOOTSTRAP_ADMIN_NAME:系統管理員}

    jwt:
      # HS256 要求金鑰至少 256 bits（32 個 ASCII 字元）。
      # 這個預設值只供本機開發，正式環境務必以 JWT_SECRET 覆寫。
      # 服務數量變多後應改用非對稱簽章：設定
      # spring.security.oauth2.resourceserver.jwt.jwk-set-uri 指向 IdP，
      # 並刪除 SecurityConfig 中的 jwtDecoder Bean 即可。
      secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
      issuer: flash-sale
      # 受眾驗證：少了它，同一個 IdP 簽給其他服務的令牌也能存取本服務
      audience: flash-sale-api
      # 刻意設短：access token 無法撤銷，停權或登出後仍會在這段時間內有效
      access-token-ttl: 15m
      # 決定「多久沒用就要重新登入」。每次續期都會輪替，舊的立即失效
      refresh-token-ttl: 7d
    # 過期令牌的清理排程；已過期的紀錄仍保留 30 天供安全事件調查
    token-cleanup-cron: "0 15 4 * * *"

  # 風控與資格預檢（ADR-0028）。熱路徑只驗憑證簽章，其餘檢查都在領資格時做。
  risk:
    # 簽資格憑證與驗證題的金鑰。正式環境務必覆寫——用預設值等於任何人都能自己簽資格
    secret: ${RISK_SECRET:dev-only-risk-secret-change-me-0123456789abcdef}
    # 關掉後熱路徑不驗憑證，只給壓測與舊腳本用
    require-qualification: ${RISK_REQUIRE_QUALIFICATION:true}
    token-ttl: 15m
    # 開賣前多久可以開始領資格
    lead-time: 30m
    challenge-ttl: 3m
    # 風險訊號（同 IP／同裝置的帳號數）只看這個窗口
    signal-window: 10m
    young-account-seconds: 600
    # 20 而不是 5：行動網路的 CGNAT 出口後面是成千上萬個真人
    max-users-per-ip: 20
    max-users-per-device: 3
    max-qualifications-per-user: 5
    reject-score: 60

  # 入場控制（ADR-0023）。**預設關閉**——會主動拒絕合法請求的機制，
  # 先讓指標跑一段時間、確認閾值訂得合理再打開。
  admission:
    enabled: ${ADMISSION_CONTROL_ENABLED:false}
    # 閾值以「使用者要等多久」表示，不以訊息數表示——
    # 訊息數在消費端加機器之後就失去意義
    max-wait-seconds: 300
    # 熱路徑讀的是這個間隔更新一次的快取值，因此尖峰的前 5 秒擋不住。
    # 那是「熱路徑零額外往返」換來的
    sample-interval-millis: 5000

  # 物件儲存（ADR-0027）。本機 MinIO，正式環境換 endpoint 即可。
  media:
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    # 讀取與寫入刻意分開：正式環境前面會擺 CDN，
    # 寫入走儲存端點、讀取走 CDN，兩者不是同一個網域
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/product-media}
    bucket: product-media
    access-key: ${MEDIA_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_SECRET_KEY:minioadmin}
    # 預簽名 URL 等於一張寫入許可，外流之後在有效期內都能被拿去用——設短一點
    upload-ttl-seconds: 300
    # 孤兒寬限期。必須明顯長於任何進行中的上傳流程，
    # 否則正在上傳的檔案會被報成待刪除
    orphan-grace-hours: 24

  rate-limit:
    # 單一使用者：桶容量 5、每秒補 1 個。容許手滑連點，擋得住腳本刷單。
    capacity: 5
    refill-per-second: 1

resilience4j:
  ratelimiter:
    instances:
      seckill:
        # 單機整體限流，保護本機執行緒池。數值需依實際壓測結果調整，
        # 原則是設在「系統仍能維持穩定延遲」的吞吐上限，而非硬體極限。
        limit-for-period: 2000
        limit-refresh-period: 1s
        # 逾時設 0：秒殺場景寧可立刻拒絕，也不要讓請求執行緒排隊等令牌
        timeout-duration: 0
        register-health-indicator: true
  circuitbreaker:
    instances:
      seckill:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        # 慢呼叫也算失敗：依賴變慢比直接掛掉更危險，會拖垮整個執行緒池
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 800ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # 業務例外不該計入熔斷統計：「已售罄」是正常結果，不是故障。
        # 漏掉這一行，活動一售罄熔斷器就會被自己的正常回應打開。
        ignore-exceptions:
          - com.flashsale.domain.shared.BusinessException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # readiness 決定「這個實例能不能接流量」，因此只能包含
        # 「壞了就真的不能服務」的依賴。
        #
        # **Elasticsearch 刻意不在裡面。** 搜尋是設計成可降級的
        # （ADR-0012 決策 4：ES 掛掉退回資料庫查詢），
        # 但預設的健康檢查會把 ES 的 DOWN 聚合進整體狀態 → /actuator/health 回 503
        # → K8s 把這個 Pod 移出負載平衡 → **整個下單系統跟著 ES 一起掛掉**。
        #
        # 實測過：停掉 ES 之後下單與商品查詢都正常，但健康檢查回 503。
        # 那等於用一個「可降級」的依賴綁架了所有不依賴它的功能。
        readiness:
          include: db, redis
        # ES 仍然出現在完整的 /actuator/health 明細裡，維運看得到它掛了，
        # 只是那不會讓實例被判定為不可服務
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  # 分散式追蹤（ADR-0029）。
  # **預設值刻意保守**：忘記設定的後果應該是 trace 少，而不是尖峰時每個請求多背
  # 一份 span 建立成本（Lettuce 那部分還跑在所有 Redis 命令共用的 netty event loop 上）。
  # 本機除錯時 TRACING_SAMPLING_PROBABILITY=1.0 開滿
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.05}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: 8080
  tomcat:
    threads:
      # 秒殺鏈路上沒有阻塞式的資料庫寫入，執行緒不需要開太多。
      # 執行緒過多只會加劇上下文切換，並讓故障時的排隊更深。
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000
  shutdown: graceful

# datasource-micrometer：只追蹤查詢與取回，不追蹤「取連線」——
# 否則排程執行緒每次拿連線都開一條 root trace，Tempo 裡全是叫 connection 的噪音
jdbc:
  includes: query,fetch

logging:
  level:
    com.flashsale: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} [traceId=%X{traceId:-} orderNo=%X{orderNo:-}] - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 讓 Swagger UI 記住輸入過的令牌，不必每次重貼
    persist-authorization: true
