spring:
  application:
    name: flash-sale

  datasource:
    # allowPublicKeyRetrieval=true 是 MySQL 8 預設的 caching_sha2_password 在
    # 非 SSL 連線下必要的參數，否則首次認證會失敗於 "Public Key Retrieval is not allowed"。
    # 它會讓用戶端向伺服器索取 RSA 公鑰，在不受信任的網路上有中間人風險——
    # 正式環境應改為 useSSL=true 並移除此參數。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:flash_sale}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${MYSQL_USER:flashsale}
    password: ${MYSQL_PASSWORD:flashsale}
    hikari:
      # 連線池大小的經驗法則：核心數 * 2 + 磁碟數。開得比這更大只會增加執行緒切換，
      # 資料庫本身的並行處理能力不會因為連線變多而提升。
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      # 比 MySQL 預設的 wait_timeout(28800s) 短，避免拿到已被伺服器關閉的死連線
      max-lifetime: 1200000

  jpa:
    hibernate:
      # 結構一律由 Flyway 管理。讓 Hibernate 自動改結構，等於把 schema 變更交給執行期決定，
      # 在生產環境是災難的起點。
      ddl-auto: validate
    open-in-view: false   # 關閉！否則交易會延續到 View 渲染，長時間佔住連線
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8
          max-wait: 500ms

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all + 冪等生產者：避免 broker 故障切換時遺失或重複訊息。
      # 秒殺的訊息遺失等於庫存永久消失，這裡不能為了吞吐妥協。
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 3
      # 攢批投遞：5ms 的延遲換取顯著的吞吐提升，對非同步建單完全無感
      batch-size: 32768
      properties.linger.ms: 5
      compression-type: lz4
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # 手動 ack 由 Spring 的 listener container 管理，關閉自動提交，
      # 否則訊息會在處理完成前就被標記為已消費，故障時直接遺失。
      enable-auto-commit: false
      max-poll-records: 100
    listener:
      ack-mode: record
      # 消費端並行度另在 @KafkaListener 上以設定值指定，方便依 topic 個別調整
      type: single

flash-sale:
  mq:
    send-timeout: 500ms
    order-create-concurrency: 6
    compensation-concurrency: 3
  order:
    payment-window: 15m
    compensation-batch-size: 200
    close-interval-ms: 30000
  stock:
    key-ttl-buffer: 2h
    warmup-interval-ms: 60000
  snowflake:
    # 多副本部署時必須各自不同，否則會產生重複訂單號。
    # K8s 可用 StatefulSet 的序號注入：node-id: ${HOSTNAME##*-}
    node-id: ${SNOWFLAKE_NODE_ID:0}
  outbox:
    batch-size: 200
    max-retry: 5
    retention-days: 7
    relay-interval-ms: 1000
    cleanup-cron: "0 30 3 * * *"
  reconciliation:
    # 每 10 分鐘核對一次「Redis 餘量 + 未取消訂單數量 = 活動總庫存」
    interval-ms: 600000
    # 啟動後先等 2 分鐘：此時預熱未完成、MQ 積壓未消化，太早對帳只會報出假偏差
    initial-delay-ms: 120000
    # 必須明顯長於 order.payment-window(15m) 與 MQ 重試總時長，
    # 否則會把還在佇列中排隊的請求誤判為孤兒而退庫 —— 那就是超賣
    orphan-grace-period: 30m
    scan-batch-size: 500
    # 預設關閉：有 bug 的自動修復，破壞力大於它要修的問題。
    # 觀察一段時間確認偵測邏輯無誤後再考慮開啟。
    auto-repair-orphans: ${RECONCILIATION_AUTO_REPAIR:false}

  security:
    jwt:
      # HS256 要求金鑰至少 256 bits（32 個 ASCII 字元）。
      # 這個預設值只供本機開發，正式環境務必以 JWT_SECRET 覆寫。
      # 服務數量變多後應改用非對稱簽章：設定 spring.security.oauth2.resourceserver.jwt.jwk-set-uri
      # 指向 IdP，並刪除 SecurityConfig 中的 jwtDecoder Bean 即可。
      secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
      issuer: flash-sale
      # 受眾驗證：少了它，同一個 IdP 簽給其他服務的令牌也能存取本服務
      audience: flash-sale-api
      ttl: 2h
    dev-token:
      # 開發用發證端點，不做任何身分驗證。
      # 設為 false 時整個 Controller Bean 都不會註冊，端點根本不存在。
      # 正式部署不要帶這個環境變數即可。
      enabled: ${DEV_TOKEN_ENABLED:true}

  rate-limit:
    # 單一使用者：桶容量 5、每秒補 1 個。容許手滑連點，擋得住腳本刷單。
    capacity: 5
    refill-per-second: 1

resilience4j:
  ratelimiter:
    instances:
      seckill:
        # 單機整體限流，保護本機執行緒池。數值需依實際壓測結果調整，
        # 原則是設在「系統仍能維持穩定延遲」的吞吐上限，而非硬體極限。
        limit-for-period: 2000
        limit-refresh-period: 1s
        # 逾時設 0：秒殺場景寧可立刻拒絕，也不要讓請求執行緒排隊等令牌
        timeout-duration: 0
        register-health-indicator: true
  circuitbreaker:
    instances:
      seckill:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        # 慢呼叫也算失敗：依賴變慢比直接掛掉更危險，會拖垮整個執行緒池
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 800ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # 業務例外不該計入熔斷統計：「已售罄」是正常結果，不是故障。
        # 漏掉這一行，活動一售罄熔斷器就會被自己的正常回應打開。
        ignore-exceptions:
          - com.flashsale.domain.shared.BusinessException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8080
  tomcat:
    threads:
      # 秒殺鏈路上沒有阻塞式的資料庫寫入，執行緒不需要開太多。
      # 執行緒過多只會加劇上下文切換，並讓故障時的排隊更深。
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000
  shutdown: graceful

logging:
  level:
    com.flashsale: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} [orderNo=%X{orderNo:-}] - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 讓 Swagger UI 記住輸入過的令牌，不必每次重貼
    persist-authorization: true
