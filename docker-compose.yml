# 本地開發與壓測用的完整依賴環境。
# 生產環境請改用託管服務或具備高可用配置的叢集——此檔案刻意單副本，只求啟動快。
#
#   docker compose up -d
#   mvn spring-boot:run -pl flash-sale-api

name: flash-sale

services:
  mysql:
    image: mysql:8.0
    container_name: flash-sale-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flash_sale
      MYSQL_USER: flashsale
      MYSQL_PASSWORD: flashsale
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 壓測時放大連線數上限，避免瓶頸出現在連線數而非真正想量測的環節
      - --max_connections=1000
      # 秒殺訂單量大，犧牲極端情況下最後 1 秒的持久性換取顯著的寫入吞吐。
      # 此設定僅適用於本地壓測，生產環境請維持預設值 1。
      - --innodb_flush_log_at_trx_commit=2
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      # 秒殺庫存是「可重建」的資料（DB 才是真實來源），因此關閉 RDB 快照：
      # fork 造成的延遲尖峰對熱路徑的傷害，大於重啟後重新預熱的成本。
      #
      # 這句話成立的前提是「重建能算出正確的餘量」，而那不是免費的：
      # StockWarmupService 必須寫入「總庫存 − 已售出」而非總庫存。
      # 直接寫總庫存的話，Redis 一重啟就會把已賣出的量全部抹掉再賣一次。
      # 實測踩過：容器重建後對帳報出 OVERSELL_RISK drift +4。
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      # 庫存鍵絕不可被驅逐，否則等同庫存憑空消失。
      # noeviction 讓記憶體不足時寫入直接失敗（可觀測），而不是靜默刪掉關鍵資料。
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # 使用 Apache 官方映像（KRaft 模式，不需要 ZooKeeper）。
    # 注意 bitnami/kafka 的環境變數前綴是 KAFKA_CFG_，官方映像則是 KAFKA_，兩者不可混用。
    image: apache/kafka:3.7.1
    container_name: flash-sale-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 關閉自動建立 topic：拼錯 topic 名稱時應該明確失敗，
      # 而不是安靜地建出一個沒人生產的空 topic 然後永遠收不到訊息。
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 單節點開發環境，縮短消費組再平衡的初始延遲
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: flash-sale-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:11.1.0
    container_name: flash-sale-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  grafana-data:
